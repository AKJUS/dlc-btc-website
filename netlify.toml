[dev]
  framework = "vite"
  command = "vite"
  targetPort = 5173

[functions]
  node_bundler = "esbuild"

[[headers]]
for = "/*"

[headers.values]
  Content-Security-Policy = "default-src 'self'; connect-src 'self' *; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' https: data:; media-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://www.youtube.com https://www.youtube.com https://s.ytimg.com; frame-src 'self' http://www.youtube.com https://www.youtube.com; style-src 'self' 'unsafe-inline'"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"
